
trigger:
  paths:
    include:
      - 'vote/*'

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'acr-gaganazurecicd'
  imageRepository: 'voteapp'
  dockerfilePath: '$(Build.SourcesDirectory)/vote/Dockerfile'
  tag: '$(Build.BuildId)'

pool:
  name: 'newazureagent'

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: Docker@2
      displayName: Build the Image
      inputs:
        command: 'build'
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Push
  displayName: Push
  dependsOn: Build
  jobs:
  - job: Push
    displayName: Push
    steps:

    # Authenticate to ACR again before pushing
    - task: Docker@2
      displayName: Login to Azure Container Registry
      inputs:
        command: 'login'
        containerRegistry: $(dockerRegistryServiceConnection)

    - task: Docker@2
      displayName: Push the Image
      inputs:
        command: 'push'
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Update
  displayName: Update
  jobs:
   - job: Update
     displayName: Update
     steps:

        - task: ShellScript@2
          inputs:
            scriptPath: 'scripts/updateK8sManifests.sh'
            args: 'vote $imageRepository $tag'